name: Backtest Strategy 3

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Full rebuild Strategy 3 Notion history"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "55 19 * * 1-5"
      timezone: "America/Los_Angeles"

concurrency:
  group: strategy3-backtest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strategy 3 backtest
        run: python strategy3.py

      - name: Sync Strategy 3 to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_rebuild || false }}
        run: python strategy3_sync.py

      - name: Upload Strategy 3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy3-results
          path: output/
          retention-days: 30
          if-no-files-found: warn
