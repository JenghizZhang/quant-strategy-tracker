name: Test Notion Comment

on:
  workflow_dispatch:

jobs:
  test-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Notion comment and mention
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MAIN_PAGE_ID: ${{ secrets.NOTION_MAIN_PAGE_ID }}
          NOTION_MENTION_NAME: ${{ secrets.NOTION_MENTION_NAME }}

        run: python test_notion_comment.py
