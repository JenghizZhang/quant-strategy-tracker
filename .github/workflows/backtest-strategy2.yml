name: Backtest Strategy 2

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Full rebuild Strategy 2 Notion history"
        required: true
        default: false
        type: boolean

  schedule:
    # Run after each US trading day.
    # 01:30 UTC Tue-Sat = previous US market day evening.
    - cron: "30 1 * * 2-6"

concurrency:
  group: strategy2-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strategy 2 backtest
        run: python strategy2.py

      - name: Sync Strategy 2 to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MAIN_PAGE_ID: ${{ secrets.NOTION_MAIN_PAGE_ID }}
          NOTION_MENTION_NAME: ${{ secrets.NOTION_MENTION_NAME }}

          CURRENT_POSITIONS_DATA_SOURCE_ID: ${{ secrets.CURRENT_POSITIONS_DATA_SOURCE_ID }}
          STRATEGY_OVERVIEW_DATA_SOURCE_ID: ${{ secrets.STRATEGY_OVERVIEW_DATA_SOURCE_ID }}
          ANNUAL_PERFORMANCE_DATA_SOURCE_ID: ${{ secrets.ANNUAL_PERFORMANCE_DATA_SOURCE_ID }}

          STRATEGY2_STATUS_DATA_SOURCE_ID: ${{ secrets.STRATEGY2_STATUS_DATA_SOURCE_ID }}
          STRATEGY2_MONTHLY_DATA_SOURCE_ID: ${{ secrets.STRATEGY2_MONTHLY_DATA_SOURCE_ID }}
          STRATEGY2_ANNUAL_DATA_SOURCE_ID: ${{ secrets.STRATEGY2_ANNUAL_DATA_SOURCE_ID }}
          STRATEGY2_HISTORY_DATA_SOURCE_ID: ${{ secrets.STRATEGY2_HISTORY_DATA_SOURCE_ID }}

          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_rebuild || false }}
        run: python strategy2_sync.py

      - name: Upload Strategy 2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy2-results
          path: output/
          retention-days: 30
          if-no-files-found: warn
