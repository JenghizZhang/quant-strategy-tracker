name: Backtest Strategy 1

on:
  # 手动运行时可以选择是否进行一次完整历史重建
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild all Strategy 1 historical Notion data"
        required: true
        type: boolean
        default: false

  # GitHub cron 使用 UTC
  #
  # 01:30 UTC Tue-Sat
  # =
  # 美东夏令时：前一天 9:30 PM
  # 美东冬令时：前一天 8:30 PM
  #
  # 自动 schedule 没有手动 input，因此 FULL_REBUILD 会自动是 false
  schedule:
    - cron: "30 1 * * 2-6"


# 避免手动运行和自动运行撞在一起
concurrency:
  group: strategy1-backtest
  cancel-in-progress: false


jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strategy 1 backtest
        run: python strategy1.py

      - name: Sync Strategy 1 to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

          NOTION_MAIN_PAGE_ID: ${{ secrets.NOTION_MAIN_PAGE_ID }}
          NOTION_MENTION_NAME: ${{ secrets.NOTION_MENTION_NAME }}

          STRATEGY1_STATUS_DATA_SOURCE_ID: ${{ secrets.STRATEGY1_STATUS_DATA_SOURCE_ID }}
          STRATEGY1_MONTHLY_DATA_SOURCE_ID: ${{ secrets.STRATEGY1_MONTHLY_DATA_SOURCE_ID }}
          STRATEGY1_ANNUAL_DATA_SOURCE_ID: ${{ secrets.STRATEGY1_ANNUAL_DATA_SOURCE_ID }}
          STRATEGY1_HISTORY_DATA_SOURCE_ID: ${{ secrets.STRATEGY1_HISTORY_DATA_SOURCE_ID }}

          CURRENT_POSITIONS_DATA_SOURCE_ID: ${{ secrets.CURRENT_POSITIONS_DATA_SOURCE_ID }}
          STRATEGY_OVERVIEW_DATA_SOURCE_ID: ${{ secrets.STRATEGY_OVERVIEW_DATA_SOURCE_ID }}
          ANNUAL_PERFORMANCE_DATA_SOURCE_ID: ${{ secrets.ANNUAL_PERFORMANCE_DATA_SOURCE_ID }}

          # 手动运行且勾选 full_rebuild 时为 true；
          # schedule 或普通手动运行时为 false。
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_rebuild || false }}

        run: python notion_sync.py

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-backtest-results
          path: output/
          retention-days: 30
